  - id: skill:botz-mcp
    kind: skill
    path: plugins/zoto-botz-skills/skills/botz-mcp/SKILL.md
    content_hash: 4b21004e3bdf01f823a6824d5510b8c30f0ff9d5230276005f26dadca9016841
    public_surface:
      frontmatter:
        name: botz-mcp
        description: Consume, stage, evolve, test, and install governed Agent Skills and
          subagent definitions from a botz-mcp server with zero-drift version
          pinning, canary A/B evaluation, and SHA-256 verification. Use whenever
          you need a capability you do not already have - follow the chained
          workflow (search -> select -> use -> feedback -> evolve/fork/create ->
          select @canary -> test -> rate -> promote), fetch unified CRUX bundles
          (skill_get_compressed / agent_get_compressed) or batched resources
          (skill_resources_get, skill_install, agent_install, or skill:// MCP
          resource templates with ETag/TTL caching), score outcomes via
          sampling/feedback, and promote verified versions.
        id: e15acdf95d3e485a93845e01468bb679
        version: "9"
        compatibility: '"Cursor, Claude Code, Codex, OpenClaw, and any MCP client
          supporting streamable HTTP (/mcp)"'
        changelog: ""
        "- 'v2": document whole-bundle CRUX serving and optional related-skill sourcing'
        "- 'v3": conversational creation, subagent definitions (agent_* tools), QSC
          objectives + telemetry'
        "- 'v4": prefer skill_get_compressed (unified CRUX incorporating all references
          and scripts); skill_get + skill_resource_get as plain-markdown
          alternative'
        "- 'v5": add silent staging (.botz/staged/), skill_install/agent_install, batch
          skill_resources_get, RFC 6570 MCP resource templates
          (skill://{name}@{version}/resources/{path} & /bundle) with ETag/TTL
          caching, updates_check + skill_diff/agent_diff, requires preflight,
          and brief secret redaction'
        "- 'v6": document all 7 MCP specification coverage stages (24 tools with
          outputSchema + structuredContent, 5-field ToolAnnotations, 4
          @mcp.prompt slash workflows /use_skill, /author_skill, /evolve_skill,
          /delegate_subagent, 4-stage notifications/progress,
          completion/complete autocomplete, client sampling/createMessage &
          roots/list workspace detection, binary BlobResourceContents on
          skill://{name}/illustration, resourceLinks,
          notifications/resources/list_changed, BoundedMemoryEventStore SSE
          resumability, and swarm_run_completed lifecycle)'
        "- 'v8": preferred skills - agents carry preferred_skills (ids) +
          preferred_skill_uris (botz://skill/<id>) frontmatter (top 5
          same-catalogue skills, auto-ranked); load them on demand via
          agent_preferred_skills(include_bodies) or skill_get(name=<id>)'
        "- 'v9": org/catalogue-first URIs - canonical
          botz://<org>/<catalogue>/skill|agent/<id> resources and
          /<org>/<catalogue>/skills|agents/<id> web paths; preferred_skill_uris
          are canonical; skill://, agent://, botz://skill/<id> and
          /skills/<name> forms are DEPRECATED (resolve only when unique, 301
          over HTTP, ambiguity error otherwise)'
        "- 'v7": add canonical chained & batched workflow reference
          (references/chained-workflows.md) covering search -> select -> use ->
          feedback -> evolve/fork/create -> select (@canary) -> test -> rate
          (sampling/feedback) -> promote, canary A/B testing (@live vs @canary),
          admin MCP promotion vs Console governance, and 24-hour generation
          quota graceful read-only degradation'
