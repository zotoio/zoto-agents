[project]
name = "eqart"
version = "0.2.0"
description = "Runtime for zoto-equation-art: eqart-ir/2 programs, renderer, metrics, MCP server"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.0",
  "pillow>=10.0",
  "zstandard>=0.22",
  "fastmcp>=2.10",
]

[project.optional-dependencies]
fit = ["jax>=0.4.30", "optax>=0.2"]
basis = ["PyWavelets>=1.6", "scipy>=1.12"]
gpu-preview = ["wgpu>=0.18"]
evolve = ["openevolve"]
svg = ["resvg-py>=0.5"]
# Opt-in perceptual judge (LPIPS). Never needed for validate/render/examples; weights are fetched on
# first explicit use (judge="perceptual" or EQART_WEIGHTS=1), never at install time.
weights = ["torch>=2.2", "lpips>=0.1.4"]

[project.scripts]
eqart = "eqart.cli:main"
eqart-mcp = "eqart.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long raster fits; run with EQART_SLOW=1"]
